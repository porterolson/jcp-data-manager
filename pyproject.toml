[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jcp-data-manager"
version = "0.1.3"
description = "Package for merging JCP session data with JCP LinkedIn members."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "polars>=1.0.0",
  "requests>=2.31.0",
  "deepface>=0.0.93",
  "gender-guesser>=0.4.0",
  "ethnicolr>=0.18.4",
  "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
jcp-data-manager = "jcp_data_manager.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
